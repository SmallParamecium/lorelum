name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun version pinned per ADR 0002 (packageManager field in package.json).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # oxfmt is still alpha (ADR 0002). Run as a non-blocking signal for now;
      # promote to blocking once it stabilizes.
      - name: Format check
        run: bun run fmt:check
        continue-on-error: true

  binary-fixtures:
    name: binary · ${{ matrix.platform }} · ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - runner: macos-14
            platform: darwin
            architecture: arm64
          - runner: windows-2022
            platform: win32
            architecture: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Verify runner identity
        shell: bash
        run: |
          echo "runner_os=$RUNNER_OS"
          echo "bun_platform=$(bun -e 'console.log(process.platform)')"
          echo "bun_arch=$(bun -e 'console.log(process.arch)')"
          echo "bun_version=$(bun --version)"
          test "$(bun -e 'console.log(process.platform)')" = "${{ matrix.platform }}"
          test "$(bun -e 'console.log(process.arch)')" = "${{ matrix.architecture }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Compile native binary
        id: compile
        shell: bash
        run: echo "path=$(bun run build:cli | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Verify compiled protocol fixtures
        shell: bash
        run: bun run verify:compiled-cli "${{ steps.compile.outputs.path }}" "${{ matrix.platform }}" "${{ matrix.architecture }}"

      - name: Build artifact metadata
        id: artifact
        shell: bash
        run: echo "name=lorelum-$(bun -e 'import manifest from "./package.json"; console.log(manifest.version)')-${{ matrix.platform }}-${{ matrix.architecture }}" >> "$GITHUB_OUTPUT"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          retention-days: 7
